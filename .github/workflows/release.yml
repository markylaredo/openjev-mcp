name: Release

# Publish by creating a GitHub release whose tag is v<package.json version>,
# e.g. v0.2.0. Authenticates to npm through trusted publishing (OIDC): on
# npmjs.com the trusted publisher must name this exact file, `release.yml`.
# No token or secret is involved.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # npm provenance and MCP Registry GitHub OIDC login

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: npm 11.5+ for trusted publishing
        run: npm install -g npm@latest
      - run: npm ci
      - name: Tag matches package.json and server.json
        run: node scripts/check-versions.mjs "${GITHUB_REF_NAME#v}"
      # Build before publishing: npm validates `bin` (dist/index.js) before
      # prepublishOnly runs, and drops a bin entry whose file does not exist.
      - run: npm run build
      - run: npm publish --provenance
      - name: Publish to the MCP Registry
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

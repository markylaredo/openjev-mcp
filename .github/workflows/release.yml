name: Release

# Publish by creating a GitHub release whose tag is v<package.json version>,
# e.g. v0.2.0. Requires an NPM_TOKEN repository secret (an npm automation token).
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # npm provenance and MCP Registry GitHub OIDC login

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Tag matches package.json and server.json
        run: node scripts/check-versions.mjs "${GITHUB_REF_NAME#v}"
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish to the MCP Registry
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
